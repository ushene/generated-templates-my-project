  # deploy-production:
  #   name: Deploy to Production
  #   if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
  #   needs: [config, build]
  #   uses: ./.github/workflows/reusable-cd-azure.yml
  #   with:
  #     app-name: ${{ needs.config.outputs.app-name }}
  #     version: ${{ needs.build.outputs.artifact_version }}
  #     environment: 'production'
  #     skip-health-check: false
  #     resource-group: ${{ vars.PROD_RESOURCE_GROUP }}
  #     resource-name: ${{ vars.PROD_RESOURCE_NAME }}
  #     resource-type: 'webapp'
  #     health-check-path: ${{ needs.config.outputs.health-check-path }}
  #     readiness-check-path: ${{ needs.config.outputs.readiness-check-path }}
  #     dotnet-runtime-version: ${{ needs.config.outputs.dotnet-runtime-version }}
