# Main Build Workflow
# Project: my-dotnet-app
# Language: .NET
# Deployment: Azure
# Purpose: Orchestrates CI/CD using reusable workflows

name: Build and Deploy

on:
  # Enable automatic workflow runs on push
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  # Uncomment below to enable automatic workflow runs on pull requests
  # pull_request:
  #   branches:
  #     - main
  #     - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: false
        type: choice
        options:
          - none
          - development
          - staging
          - production
        default: 'none'
      app-name:
        description: 'Application name'
        required: false
        type: string
        default: 'MyTestApp'
      jfrog-repository:
        description: 'JFrog repository name'
        required: false
        type: string
        default: 'my-app-local'
      build-configuration:
        description: 'Build configuration'
        required: false
        type: string
        default: 'Release'
      dotnet-version:
        description: '.NET SDK version'
        required: false
        type: string
        default: '8.x'
      source-directory:
        description: 'Source root directory'
        required: false
        type: string
        default: 'test-dotnet-app'
      project-file:
        description: 'Application project file path'
        required: false
        type: string
        default: 'test-dotnet-app/src/MyTestApp.Api/MyTestApp.Api.csproj'
      test-project-file:
        description: 'Test project file or folder'
        required: false
        type: string
        default: 'test-dotnet-app'
      publish-directory:
        description: 'Publish output directory'
        required: false
        type: string
        default: 'test-dotnet-app/publish'
      snyk-scan-directory:
        description: 'Directory to use for Snyk scanning'
        required: false
        type: string
        default: 'test-dotnet-app/src/MyTestApp.Api'
      dev-resource-group:
        description: 'Development Azure resource group'
        required: false
        type: string
        default: ''
      dev-resource-name:
        description: 'Development Azure resource name'
        required: false
        type: string
        default: ''
      resource-type:
        description: 'Azure resource type'
        required: false
        type: string
        default: 'webapp'
      skip_tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false

# Centralized configuration
env:
  APP_NAME: ${{ inputs.app-name }}
  JFROG_REPOSITORY: ${{ inputs.jfrog-repository }}
  BUILD_CONFIGURATION: ${{ inputs.build-configuration }}
  DOTNET_VERSION: ${{ inputs.dotnet-version }}
  SOURCE_DIRECTORY: ${{ inputs.source-directory }}
  PROJECT_FILE: ${{ inputs.project-file }}
  TEST_PROJECT_FILE: ${{ inputs.test-project-file }}
  PUBLISH_DIRECTORY: ${{ inputs.publish-directory }}
  SNYK_SCAN_DIRECTORY: ${{ inputs.snyk-scan-directory }}
  DEV_RESOURCE_GROUP: ${{ inputs.dev-resource-group }}
  DEV_RESOURCE_NAME: ${{ inputs.dev-resource-name }}
  RESOURCE_TYPE: ${{ inputs.resource-type }}

jobs:
  # Job 0: Setup configuration (workaround for env limitation in reusable workflows)
  config:
    name: Setup Configuration
    runs-on: ubuntu-latest
    outputs:
      app-name: ${{ steps.set-config.outputs.app-name }}
      jfrog-repository: ${{ steps.set-config.outputs.jfrog-repository }}
      build-configuration: ${{ steps.set-config.outputs.build-configuration }}
      dotnet-version: ${{ steps.set-config.outputs.dotnet-version }}
      source-directory: ${{ steps.set-config.outputs.source-directory }}
      project-file: ${{ steps.set-config.outputs.project-file }}
      test-project-file: ${{ steps.set-config.outputs.test-project-file }}
      publish-directory: ${{ steps.set-config.outputs.publish-directory }}
      snyk-scan-directory: ${{ steps.set-config.outputs.snyk-scan-directory }}
      dev-resource-group: ${{ steps.set-config.outputs.dev-resource-group }}
      dev-resource-name: ${{ steps.set-config.outputs.dev-resource-name }}
      resource-type: ${{ steps.set-config.outputs.resource-type }}
    steps:
      - name: Set configuration outputs
        id: set-config
        run: |
          echo "app-name=${{ env.APP_NAME }}" >> $GITHUB_OUTPUT
          echo "jfrog-repository=${{ env.JFROG_REPOSITORY }}" >> $GITHUB_OUTPUT
          echo "build-configuration=${{ env.BUILD_CONFIGURATION }}" >> $GITHUB_OUTPUT
          echo "dotnet-version=${{ env.DOTNET_VERSION }}" >> $GITHUB_OUTPUT
          echo "source-directory=${{ env.SOURCE_DIRECTORY }}" >> $GITHUB_OUTPUT
          echo "project-file=${{ env.PROJECT_FILE }}" >> $GITHUB_OUTPUT
          echo "test-project-file=${{ env.TEST_PROJECT_FILE }}" >> $GITHUB_OUTPUT
          echo "publish-directory=${{ env.PUBLISH_DIRECTORY }}" >> $GITHUB_OUTPUT
          echo "snyk-scan-directory=${{ env.SNYK_SCAN_DIRECTORY }}" >> $GITHUB_OUTPUT
          echo "dev-resource-group=${{ env.DEV_RESOURCE_GROUP }}" >> $GITHUB_OUTPUT
          echo "dev-resource-name=${{ env.DEV_RESOURCE_NAME }}" >> $GITHUB_OUTPUT
          echo "resource-type=${{ env.RESOURCE_TYPE }}" >> $GITHUB_OUTPUT

  # Job 1: Build using reusable CI workflow
  build:
    name: Build Application
    needs: config
    uses: ./.github/workflows/reusable-ci-net.yml
    with:
      app-name: ${{ needs.config.outputs.app-name }}
      build-configuration: ${{ needs.config.outputs.build-configuration }}
      NET-version: ${{ needs.config.outputs.dotnet-version }}
      skip-tests: ${{ inputs.skip_tests || false }}
      skip-security-scan: false
      jfrog-repository: ${{ needs.config.outputs.jfrog-repository }}
      source-directory: ${{ needs.config.outputs.source-directory }}
      project-file: ${{ needs.config.outputs.project-file }}
      test-project-file: ${{ needs.config.outputs.test-project-file }}
      publish-directory: ${{ needs.config.outputs.publish-directory }}
      snyk-scan-directory: ${{ needs.config.outputs.snyk-scan-directory }}
    secrets:
      JFROG_URL: ${{ secrets.JFROG_URL }}
      JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
      JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  
  # Deployment jobs enabled now that Azure quota is available
  # These jobs run only when the appropriate branch and event conditions are met.
  
  # Job 2: Deploy to development (automatic on develop branch)
  deploy-dev:
    name: Deploy to Development
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'development') }}
    needs: [config, build]
    uses: ./.github/workflows/reusable-cd-azure.yml
    with:
      app-name: ${{ needs.config.outputs.app-name }}
      version: ${{ needs.build.outputs.artifact_version }}
      environment: 'development'
      skip-health-check: false
      jfrog-repository: ${{ needs.config.outputs.jfrog-repository }}
      resource-group: ${{ needs.config.outputs.dev-resource-group || vars.DEV_RESOURCE_GROUP }}
      resource-name: ${{ needs.config.outputs.dev-resource-name || vars.DEV_RESOURCE_NAME }}
      resource-type: ${{ needs.config.outputs.resource-type }}
    secrets: inherit
  
  # Job 3: Deploy to staging (disabled)
  # deploy-staging:
  #   name: Deploy to Staging
  #   if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
